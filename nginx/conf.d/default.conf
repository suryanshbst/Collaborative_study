# ==========================================
# StudySphere Nginx Reverse Proxy Configuration
# Handles HTTP/HTTPS, WebSockets, Next.js, and Express API
# ==========================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

upstream web_upstream {
    server web:3000;
    keepalive 32;
}

# ==========================================
# HTTP Server (Port 80)
# ==========================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt / Certbot Challenge Path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ==========================================
    # Express REST API
    # ==========================================
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for long requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==========================================
    # WebRTC Signaling & WebSocket Connections
    # ==========================================
    location /ws {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSockets alive without timeout
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ==========================================
    # Next.js Static Optimization Assets Caching
    # ==========================================
    location /_next/static/ {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ==========================================
    # Next.js Web Frontend & Root WebSocket Fallback
    # ==========================================
    location / {
        # Check if incoming request is a WebSocket upgrade
        if ($http_upgrade = "websocket") {
            proxy_pass http://backend_upstream;
        }

        proxy_pass http://web_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
