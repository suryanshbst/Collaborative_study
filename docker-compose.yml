services:
  # ==========================================
  # Express & WebSocket API Backend
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.backend
    container_name: studysphere-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8000
    ports:
      - "8000:8000"
    networks:
      - studysphere-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ==========================================
  # Next.js Web Frontend
  # ==========================================
  web:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.frontend
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: studysphere-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - studysphere-network

  # ==========================================
  # Nginx Reverse Proxy (SSL Termination & WS Routing)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: studysphere-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
      - backend
    networks:
      - studysphere-network

networks:
  studysphere-network:
    driver: bridge
