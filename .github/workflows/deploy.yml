name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Continuous Integration (Lint & Type-Check)
  # ==========================================
  ci-check:
    name: Build & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Monorepo Dependencies
        run: bun install

      - name: Generate Prisma Client
        run: |
          cd packages/db
          DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy?sslmode=disable" bun x prisma generate

      - name: Typecheck Monorepo
        run: bun run check-types

  # ==========================================
  # 2. Continuous Deployment (SSH to AWS EC2)
  # ==========================================
  deploy:
    name: Deploy to EC2 Instance
    runs-on: ubuntu-latest
    needs: [ci-check]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: SSH into EC2 & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "==========================================="
            echo "🚀 Starting StudySphere Deployment..."
            echo "==========================================="

            # Navigate to project directory
            if [ -d "$HOME/collab_study" ]; then
              cd "$HOME/collab_study"
            elif [ -d "/var/www/collab_study" ]; then
              cd "/var/www/collab_study"
            else
              echo "Error: Application directory not found on EC2!"
              exit 1
            fi

            # 1. Pull latest commits from GitHub
            echo "📥 Pulling latest code from origin..."
            git pull origin ${{ github.ref_name }}

            # 2. Build & Recreate Production Docker Containers
            echo "🐳 Building & restarting Docker containers..."
            docker compose build
            docker compose up -d --remove-orphans

            # 3. Clean up dangling unused images to save disk space
            echo "🧹 Cleaning up unused Docker artifacts..."
            docker image prune -f

            echo "=========================================="
            echo "🎉 StudySphere successfully deployed!"
            echo "=========================================="
